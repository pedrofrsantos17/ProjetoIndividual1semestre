<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.css">
    <title>PULL UP HOOPS - Cadastro</title>

    <style>
        /* Ajustes visuais do cadastro */
        nav .btn-login,
        nav .btn-cadastro {
            width: auto;
            display: inline-block;
            padding: 0.6rem 1.4rem;
            font-size: 1rem;
            font-weight: bold;
        }

        .btn-mostrar-senha {
            width: fit-content;
            margin: 0.5rem auto 0;
            display: block;
        }
    </style>
</head>
<header>
    <div class="logo">PULL UP HOOPS</div>
    <img class="img" src="logo.png" alt="PULL UP HOOPS Logo">
    <nav>
        <a href="index.html" class="btn-login">Login</a>
        <a href="index.html" class="btn-cadastro">Home</a>
    </nav>
</header>
<body>

    <div class="cadastro-container" style="margin-top: 90px;">
        <h2>Cadastro</h2>
        <form id="form-cadastro">
            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="ipt_nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="ipt_email" name="email" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="ipt_senha" required>
                <button type="button" class="botao" onclick="mostrarsenha()">Mostrar senha</button>
            </div>

            <button type="button" id="btn-cadastrar" class="btn-cadastro">Cadastrar</button>
        </form>
        <div id="mensagem-sucesso" style="margin-top: 2rem; padding: 1rem; border-radius: 8px; text-align: center; display: none; font-size: 1.2rem; font-weight: bold; color: #4CAF50; background: rgba(0,128,0,0.2);"></div>
    </div>

    <script>

        

        function mostrarsenha(){
            const senha = document.getElementById("ipt_senha")
            if(senha.type === "password"){
                senha.type = "text"
            } else {
                senha.type = "password"
            }
        }
    // Vetor global para armazenar resultados da validação
    const validacoes = [];

    document.getElementById('btn-cadastrar').addEventListener('click', function(event) {
        // Impede o envio padrão do formulário (que recarregaria a página e abortaria o fetch)
        event.preventDefault();

        // Limpar vetor de validações
        validacoes.length = 0;

        // Pegar valores dos inputs usando .value
        const nome = document.getElementById('ipt_nome').value;
        const email = document.getElementById('ipt_email').value;
        const senha = document.getElementById('ipt_senha').value;

        // Validar nome: deve conter letras e ter no mínimo 3 caracteres
        if (nome.length < 3) {
            validacoes.push('nome_invalido');
            alert('Nome deve ter no mínimo 3 caracteres');
        } else if (!nome.match(/^[A-Za-zÀ-ÿ\s]+$/)) {
            validacoes.push('nome_contém_números');
            alert('Nome deve conter apenas letras');
        }

        // Validar email usando includes
        if (!email.includes('@') || !email.includes('.')) {
            validacoes.push('email_invalido');
            alert('Email inválido: deve conter @ e .');
        }

        // Validar senha: mínimo 8 caracteres, número e letra maiúscula
        const temMaiuscula = /[A-Z]/.test(senha);
        const temNumero = /\d/.test(senha);
        const temMinimo8 = senha.length >= 8;

        if (!temMinimo8) {
            validacoes.push('senha_curta');
            alert('Senha deve ter no mínimo 8 caracteres');
        } else if (!temNumero) {
            validacoes.push('sem_numero');
            alert('Senha deve ter pelo menos 1 número');
        } else if (!temMaiuscula) {
            validacoes.push('sem_maiúscula');
            alert('Senha deve ter pelo menos 1 letra maiúscula');
        }

        // Se vetor de validações estiver vazio, cadastro foi bem-sucedido
        if (validacoes.length === 0) {

            // Rota de cadastro da API
            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nomeServer: nome,
                    emailServer: email,
                    senhaServer: senha
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    return resposta.json();
                }
                throw "Houve um erro ao cadastrar o usuário!";
            }).then(function (data) {
                document.getElementById('mensagem-sucesso').style.display = 'block';
                document.getElementById('mensagem-sucesso').innerHTML = data.mensagem;
                // Limpar formulário
                document.getElementById('form-cadastro').reset();
            }).catch(function (erro) {
                document.getElementById('mensagem-sucesso').style.display = 'block';
                document.getElementById('mensagem-sucesso').innerHTML = "Erro ao cadastrar: " + erro;
            });

        }
    });
    </script>

</body>
</html>
