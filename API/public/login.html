<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.css">
    <title>PULL UP HOOPS - Login</title>
</head>
<body>

    <header>
        <div class="logo">PULL UP HOOPS</div>
        <img class="img" src="logo.png" alt="PULL UP HOOPS Logo">
        <nav>
            <a href="index.html" class="btn-login">Login</a>
            <a href="cadastro.html" class="btn-cadastro">Cadastro</a>
        </nav>
    </header>

    <main style="margin-top: 0; padding-top: 90px;">
        <section class="login-container">
            <div class="container">
                <h2>Login</h2>
                <form id="form-login">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="ipt_email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="ipt_senha" name="senha" required>
                    </div>
                    <button type="submit" class="btn-cadastro">Entrar</button>
                </form>
                <p style="margin-top: 1rem; text-align: center;">Não tem uma conta? <a href="cadastro.html" style="color: var(--dourado-titulo);">Cadastre-se</a></p>
                <div id="mensagem-erro" style="margin-top: 1rem; display: none; padding: 1rem; border-radius: 8px; text-align: center; color: var(--chama-vermelha); background: rgba(255,69,58,0.15);"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>2026. Pedro Henrique Ferreira Rodrigues Santos</p>
    </footer>

    <script>
        function mostrarMensagemErro(mensagem) {
            var divErro = document.getElementById("mensagem-erro");
            divErro.style.display = "block";
            divErro.innerHTML = mensagem;
        }

        function limparMensagemErro() {
            var divErro = document.getElementById("mensagem-erro");
            divErro.style.display = "none";
            divErro.innerHTML = "";
        }

        function entrar() {
            limparMensagemErro();

            var emailVar = document.getElementById("ipt_email").value;
            var senhaVar = document.getElementById("ipt_senha").value;

            if (emailVar == "" || senhaVar == "") {
                mostrarMensagemErro("E-mail ou senha inválidos");
                return false;
            }

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: emailVar,
                    senhaServer: senhaVar
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (json) {
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.id;
                        sessionStorage.AQUARIOS = JSON.stringify([]);

                        setTimeout(function () {
                            window.location.href = "/quiz";
                        }, 1000);
                    });
                } else {
                    resposta.text().then(function (texto) {
                        mostrarMensagemErro(texto);
                    });
                }
            }).catch(function (erro) {
                console.log(erro);
                mostrarMensagemErro("Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.");
            });

            return false;
        }

        document.getElementById("form-login").addEventListener("submit", function (event) {
            event.preventDefault();
            entrar();
        });
    </script>

</body>
</html>
