<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">

        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!--FONT AWESOME-->
    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-escuro: #0A0E0C;
            --verde-chama: #2D5A27;
            --dourado-titulo: #F5C35E;
            --laranja-bola: #FF6B35;
            --dourado-detalhe: #E8B445;
            --chama-clara: #FFFEe0;
            --chama-vermelha: #FF453A;
            --roxo-acento: #6C5CE7;
        }

        #resultadosQuiz {
            padding: 20px;
            color: var(--chama-clara);
        }

        .cards-resumo {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px auto;
            max-width: 900px;
        }

        .card-resumo {
            background-color: #212124;
            border: 1px solid var(--dourado-detalhe);
            border-radius: 10px;
            padding: 15px 25px;
            text-align: center;
            min-width: 140px;
        }

        .card-resumo .numero {
            display: block;
            font-size: 2rem;
            font-weight: 800;
            color: var(--laranja-bola);
        }

        .card-resumo .rotulo {
            font-size: 0.85rem;
            color: #d8d8d8;
        }

        #listaTentativas {
            max-width: 700px;
            margin: 20px auto;
        }

        .item-tentativa {
            background-color: #212124;
            border-left: 3px solid var(--laranja-bola);
            border-radius: 6px;
            padding: 10px 15px;
            margin-bottom: 10px;
            color: var(--chama-clara);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sem-dados {
            text-align: center;
            color: #d8d8d8;
            padding: 20px;
        }
    </style>
</head>

<!-- <body onload=" atualizarFeed()"> -->

<body>

    <div class="janela">
        <div class="header-left">
            <h1>AquaTech</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./cards.html">
                    <h3>Aquários e Terrários</h3>
                </a>
            </div>

            <div class="btn-nav">

                <h3>Gráficos</h3>

            </div>

            <div class="btn-nav-white">
                <a href="./mural.html">
                    <h3>Mural de Avisos</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash">
            <div id="alerta">
            </div>

            <div class="btns-dash" id="btnAquario">
                <!-- O gráfico é chamado de acordo com o id (fk_aquario) do banco  -->
            </div>
            <div id="graficos">
            </div>

            <div id="resultadosQuiz">
                <h3 class="tituloGraficos">Resultados do Quiz</h3>
                <div class="cards-resumo" id="cardsResumo">
                    <!-- Os cards de resumo são montados via JavaScript -->
                </div>
                <div class="graph">
                    <canvas id="graficoPizzaClassificacao"></canvas>
                </div>
                <div id="listaTentativas">
                    <!-- A lista de tentativas é montada via JavaScript -->
                </div>
            </div>
        </div>
    </div>


</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    let proximaAtualizacao;

    window.onload = function() {
        validarSessao();
        exibirAquariosDoUsuario();
        exibirResultadosQuiz();
    };

    function exibirAquariosDoUsuario() {
        var aquarios = JSON.parse(sessionStorage.AQUARIOS);
        aquarios.forEach(item => {
            document.getElementById("btnAquario").innerHTML += `
            <button class="btn-chart" onclick="exibirAquario(${item.id})" id="btnAquario${item.id}">${item.descricao}</button>
            `

            document.getElementById("graficos").innerHTML += `
                <div id="grafico${item.id}" class="display-none">
                    <h3 class="tituloGraficos">
                        <span id="tituloAquario${item.id}">${item.descricao}</span>
                    </h3>
                    <div class="graph">
                        <canvas id="myChartCanvas${item.id}"></canvas>
                    </div>
                    <div class="label-captura">
                        <p id="avisoCaptura${item.id}" style="color: white"></p>
                    </div>
                </div>
            `

            obterDadosGrafico(item.id)
        });

        if (aquarios.length > 0) {
            exibirAquario(aquarios[0].id)
        }
    }

    // ---------- Resultados do Quiz ----------

    let graficoPizza = null;

    // Busca as tentativas finalizadas do quiz na API e exibe no dashboard
    function exibirResultadosQuiz() {
        fetch("/quiz/listar", { cache: 'no-store' })
            .then(function (response) {
                if (response.ok) {
                    return response.json();
                }
                throw "Não foi possível carregar os resultados do quiz!";
            })
            .then(function (tentativas) {
                console.log(`Dados recebidos do quiz: ${JSON.stringify(tentativas)}`);
                renderizarResumoQuiz(tentativas);
                renderizarGraficoPizza(tentativas);
                renderizarListaTentativas(tentativas);
            })
            .catch(function (error) {
                console.error(`Erro na obtenção dos resultados do quiz: ${error}`);
                document.getElementById("listaTentativas").innerHTML = "Erro ao carregar os resultados do quiz. Tente novamente mais tarde.";
            });
    }

    // Monta os cartoes de resumo (tentativas, jogadores, media, melhor e pior resultado)
    function renderizarResumoQuiz(tentativas) {
        var totalTentativas = tentativas.length;
        var quantidadeJogadores = {};
        var somaPercentual = 0;
        var maiorPercentual = 0;
        var menorPercentual = 0;

        for (var i = 0; i < tentativas.length; i++) {
            var t = tentativas[i];
            quantidadeJogadores[t.fk_usuario] = true;
            somaPercentual += t.percentual;

            if (i === 0 || t.percentual > maiorPercentual) {
                maiorPercentual = t.percentual;
            }
            if (i === 0 || t.percentual < menorPercentual) {
                menorPercentual = t.percentual;
            }
        }

        var mediaPercentual = tentativas.length > 0 ? (somaPercentual / tentativas.length) : 0;

        document.getElementById("cardsResumo").innerHTML = `
            <div class="card-resumo">
                <span class="numero">${totalTentativas}</span>
                <span class="rotulo">Tentativas</span>
            </div>
            <div class="card-resumo">
                <span class="numero">${Object.keys(quantidadeJogadores).length}</span>
                <span class="rotulo">Jogadores</span>
            </div>
            <div class="card-resumo">
                <span class="numero">${mediaPercentual.toFixed(1)}%</span>
                <span class="rotulo">Média</span>
            </div>
            <div class="card-resumo">
                <span class="numero">${maiorPercentual}%</span>
                <span class="rotulo">Melhor</span>
            </div>
            <div class="card-resumo">
                <span class="numero">${menorPercentual}%</span>
                <span class="rotulo">Pior</span>
            </div>
        `;
    }

    // Monta o grafico de pizza com a distribuicao das classificacoes
    function renderizarGraficoPizza(tentativas) {
        var lista = document.getElementById("listaTentativas");

        if (!tentativas || tentativas.length === 0) {
            if (graficoPizza) {
                graficoPizza.destroy();
                graficoPizza = null;
            }
            document.getElementById("graficoPizzaClassificacao").style.display = "none";
            lista.innerHTML = "<p class='sem-dados'>Ainda não há dados</p>";
            return;
        }

        document.getElementById("graficoPizzaClassificacao").style.display = "block";

        if (graficoPizza) {
            graficoPizza.destroy();
        }

        var distribuicao = { INSUFICIENTE: 0, REGULAR: 0, EXCELENTE: 0 };

        for (var i = 0; i < tentativas.length; i++) {
            var t = tentativas[i];
            if (distribuicao[t.classificacao] !== undefined) {
                distribuicao[t.classificacao] = distribuicao[t.classificacao] + 1;
            }
        }

        graficoPizza = new Chart(document.getElementById("graficoPizzaClassificacao"), {
            type: 'pie',
            data: {
                labels: ["INSUFICIENTE", "REGULAR", "EXCELENTE"],
                datasets: [
                    {
                        label: "Tentativas",
                        data: [
                            distribuicao.INSUFICIENTE,
                            distribuicao.REGULAR,
                            distribuicao.EXCELENTE
                        ],
                        backgroundColor: [
                            "rgb(255, 69, 58)",
                            "rgb(245, 195, 94)",
                            "rgb(255, 107, 53)"
                        ],
                        borderColor: "#161618",
                        borderWidth: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: "#FFFEe0" }
                    }
                }
            }
        });
    }

    // Monta a lista de tentativas finalizadas
    function renderizarListaTentativas(tentativas) {
        var lista = document.getElementById("listaTentativas");

        if (!tentativas || tentativas.length === 0) {
            return;
        }

        var html = "";
        for (var i = 0; i < tentativas.length; i++) {
            var t = tentativas[i];
            html += `
                <div class="item-tentativa">
                    <span><strong>Tentativa #${t.id_tentativa}</strong> - ${t.dt_inicio}</span>
                    <span>${t.acertos} de ${t.total_questoes} acertos (${t.erros} erros)</span>
                    <span><strong>${t.percentual}%</strong> - ${t.classificacao}</span>
                </div>
            `;
        }

        lista.innerHTML = html;
    }

    function alterarTitulo(idAquario) {
        var tituloAquario = document.getElementById(`tituloAquario${idAquario}`)
        var descricao = JSON.parse(sessionStorage.AQUARIOS).find(item => item.id == idAquario).descricao;
        tituloAquario.innerHTML = "Últimas medidas do <span style='color: #e6005a'>" + descricao + "</span>"
    }

    function exibirAquario(idAquario) {
        let todosOsGraficos = JSON.parse(sessionStorage.AQUARIOS);

        for (i = 0; i < todosOsGraficos.length; i++) {
            // exibindo - ou não - o gráfico
            if (todosOsGraficos[i].id != idAquario) {
                let elementoAtual = document.getElementById(`grafico${todosOsGraficos[i].id}`)
                if (elementoAtual.classList.contains("display-block")) {
                    elementoAtual.classList.remove("display-block")
                }
                elementoAtual.classList.add("display-none")

                // alterando estilo do botão
                let btnAtual = document.getElementById(`btnAquario${todosOsGraficos[i].id}`)
                if (btnAtual.classList.contains("btn-pink")) {
                    btnAtual.classList.remove("btn-pink")
                }
                btnAtual.classList.add("btn-white")
            }
        }

        // exibindo - ou não - o gráfico
        let graficoExibir = document.getElementById(`grafico${idAquario}`)
        graficoExibir.classList.remove("display-none")
        graficoExibir.classList.add("display-block")

        // alterando estilo do botão
        let btnExibir = document.getElementById(`btnAquario${idAquario}`)
        btnExibir.classList.remove("btn-white")
        btnExibir.classList.add("btn-pink")
    }

    // O gráfico é construído com três funções:
    // 1. obterDadosGrafico -> Traz dados do Banco de Dados para montar o gráfico da primeira vez
    // 2. plotarGrafico -> Monta o gráfico com os dados trazidos e exibe em tela
    // 3. atualizarGrafico -> Atualiza o gráfico, trazendo novamente dados do Banco

    // Esta função *obterDadosGrafico* busca os últimos dados inseridos em tabela de medidas.
    // para, quando carregar o gráfico da primeira vez, já trazer com vários dados.
    // A função *obterDadosGrafico* também invoca a função *plotarGrafico*

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
    function obterDadosGrafico(idAquario) {

        alterarTitulo(idAquario)

        if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }

        fetch(`/medidas/ultimas/${idAquario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    plotarGrafico(resposta, idAquario);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    // Esta função *plotarGrafico* usa os dados capturados na função anterior para criar o gráfico
    // Configura o gráfico (cores, tipo, etc), materializa-o na página e, 
    // A função *plotarGrafico* também invoca a função *atualizarGrafico*
    function plotarGrafico(resposta, idAquario) {

        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [
            {
                label: 'Temperatura',
                data: [],
                fill: false,
                borderColor: 'rgb(199, 52, 52)',
                tension: 0.1
            }]
        };

        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.momento_grafico);
            dados.datasets[0].data.push(registro.temperatura);
        }

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'line',
            data: dados,
        };

        // Adicionando gráfico criado em div na tela
        let myChart = new Chart(
            document.getElementById(`myChartCanvas${idAquario}`),
            config
        );

        setTimeout(() => atualizarGrafico(idAquario, dados, myChart), 2000);
    }


    // Esta função *atualizarGrafico* atualiza o gráfico que foi renderizado na página,
    // buscando a última medida inserida em tabela contendo as capturas, 

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
    function atualizarGrafico(idAquario, dados, myChart) {



        fetch(`/quiz//${idAquario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    obterdados(idAquario);
                    // alertar(novoRegistro, idAquario);
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);
                    console.log(dados);

                    let avisoCaptura = document.getElementById(`avisoCaptura${idAquario}`)
                    avisoCaptura.innerHTML = ""


                    if (novoRegistro[0].momento_grafico == dados.labels[dados.labels.length - 1]) {
                        console.log("---------------------------------------------------------------")
                        console.log("Como não há dados novos para captura, o gráfico não atualizará.")
                        avisoCaptura.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Foi trazido o dado mais atual capturado pelo sensor. <br> Como não há dados novos a exibir, o gráfico não atualizará."
                        console.log("Horário do novo dado capturado:")
                        console.log(novoRegistro[0].momento_grafico)
                        console.log("Horário do último dado capturado:")
                        console.log(dados.labels[dados.labels.length - 1])
                        console.log("---------------------------------------------------------------")
                    } else {
                        // tirando e colocando valores no gráfico
                        dados.labels.shift(); // apagar o primeiro
                        dados.labels.push(novoRegistro[0].momento_grafico); // incluir um novo momento

                        dados.datasets[0].data.shift();  // apagar o primeiro de temperatura
                        dados.datasets[0].data.push(novoRegistro[0].temperatura); // incluir uma nova medida de temperatura

                        myChart.update();
                    }

                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacao = setTimeout(() => atualizarGrafico(idAquario, dados, myChart), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacao = setTimeout(() => atualizarGrafico(idAquario, dados, myChart), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }
</script>
