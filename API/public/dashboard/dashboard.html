<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULL UP HOOPS | Dashboard</title>

    <link rel="stylesheet" href="../Style.css">
    <script src="../js/sessao.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!--FONT AWESOME-->
    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>

   
</head>

<body onload="validarSessao(), exibirResultadosQuiz()">

    <header>
        <div class="logo">PULL UP HOOPS</div>
        <img class="img" src="../logo.png" alt="PULL UP HOOPS Logo">
        <nav>
            <a href="../index.html" class="btn-login">Home</a>
            <a href="../Cadastro.html" class="btn-cadastro">Cadastro</a>
        </nav>
    </header>

    <main>
        <section class="dashboard">
            <div class="dashboard-header"> <br> <br>
                <h2 style="text-align: center;">Resultados do Quiz</h2>
                <div class="btn-logout" onclick="limparSessao()">
                    <h3>Sair</h3>
                </div>
            </div>

            <div id="resultadosQuiz">
                <div class="cadastro-container">
                    <p class="boas-vindas">Olá, <span id="b_usuario">usuário</span>! Aqui estão os resultados do quiz:</p>

                    <div class="cards-resumo" id="cardsResumo">
                        <!-- Os cards de resumo são montados via JavaScript -->
                    </div>
                     <div class="graph grafico-pizza">
                        <canvas id="graficoPizzaClassificacao"></canvas>
                    </div>
                    <div class="graph grafico-barras">
                        <canvas id="graficoBarrasEnquete"></canvas>
                    </div>

                    <div id="listaTentativas" class="lista-tentativas">
                        <!-- A lista de tentativas é montada via JavaScript -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>2026. Pedro Henrique Ferreira Rodrigues Santos</p>
    </footer>

    <script>
        b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

        let graficoPizza = null;
        let graficoBarras = null;

        // Busca as tentativas finalizadas do quiz na API e exibe no dashboard
        function exibirResultadosQuiz() {
            fetch("/quiz/listar", { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        return response.json();
                    }
                    throw "Não foi possível carregar os resultados do quiz!";
                })
                .then(function (tentativas) {
                    renderizarResumoQuiz(tentativas);
                    renderizarGraficoPizza(tentativas);
                    renderizarListaTentativas(tentativas);
                    exibirGraficoEnquete();
                })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos resultados do quiz: ${error}`);
                    document.getElementById("listaTentativas").innerHTML = "Erro ao carregar os resultados do quiz. Tente novamente mais tarde.";
                });
        }

        // Monta os cartões de resumo (tentativas, jogadores, media, melhor e pior resultado)
       function renderizarResumoQuiz(tentativas) {
    var totalTentativas = tentativas.length;
    var jogadores = {};
    var soma = 0;
    var maior = 0;
    var menor = 0;

    for (var i = 0; i < tentativas.length; i++) {
        var t = tentativas[i];
        var perc = Number(t.percentual);

        jogadores[t.fk_usuario] = true;
        soma += perc;

        if (i === 0 || perc > maior) maior = perc;
        if (i === 0 || perc < menor) menor = perc;
    }

    var media = totalTentativas > 0 ? (soma / totalTentativas) : 0;

    document.getElementById("cardsResumo").innerHTML = `
        <div class="card-resumo">
            <span class="numero">${totalTentativas}</span>
            <span class="rotulo">Tentativas</span>
        </div>
        <div class="card-resumo">
            <span class="numero">${Object.keys(jogadores).length}</span>
            <span class="rotulo">Jogadores</span>
        </div>
        <div class="card-resumo">
            <span class="numero">${media.toFixed(1)}%</span>
            <span class="rotulo">Média</span>
        </div>
        <div class="card-resumo">
            <span class="numero">${maior}%</span>
            <span class="rotulo">Melhor</span>
        </div>
        <div class="card-resumo">
            <span class="numero">${menor}%</span>
            <span class="rotulo">Pior</span>
        </div>
    `;
}
        

        // Monta o gráfico de pizza com a distribuição das classificações
        function renderizarGraficoPizza(tentativas) {
            if (!tentativas || tentativas.length === 0) {
                if (graficoPizza) {
                    graficoPizza.destroy();
                    graficoPizza = null;
                }
                document.getElementById("graficoPizzaClassificacao").style.display = "none";
                document.getElementById("listaTentativas").innerHTML = "<p class='sem-dados'>Ainda não há dados</p>";
                return;
            }

            document.getElementById("graficoPizzaClassificacao").style.display = "block";

            if (graficoPizza) {
                graficoPizza.destroy();
            }

            var distribuicao = { INSUFICIENTE: 0, REGULAR: 0, EXCELENTE: 0 };

            for (var i = 0; i < tentativas.length; i++) {
                var t = tentativas[i];
                if (distribuicao[t.classificacao] !== undefined) {
                    distribuicao[t.classificacao] = distribuicao[t.classificacao] + 1;
                }
            }

            graficoPizza = new Chart(document.getElementById("graficoPizzaClassificacao"), {
                type: 'pie',
                data: {
                    labels: ["INSUFICIENTE", "REGULAR", "EXCELENTE"],
                    datasets: [
                        {
                            label: "Tentativas",
                            data: [
                                distribuicao.INSUFICIENTE,
                                distribuicao.REGULAR,
                                distribuicao.EXCELENTE
                            ],
                            backgroundColor: [
                                "rgb(255, 69, 58)",
                                "rgb(245, 195, 94)",
                                "rgb(255, 107, 53)"
                            ],
                            borderColor: "#161618",
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: "#FFFEe0" }
                        }
                    }
                }
            });
        }

        // Monta a lista de tentativas finalizadas
        function renderizarListaTentativas(tentativas) {
            var lista = document.getElementById("listaTentativas");

            if (!tentativas || tentativas.length === 0) {
                lista.innerHTML = "<p class='sem-dados'>Ainda não há dados</p>";
                return;
            }

            var html = "";
            for (var i = 0; i < tentativas.length; i++) {
                var t = tentativas[i];
                html += `
                    <div class="item-tentativa">
                        <span><strong>Tentativa #${t.id_tentativa}</strong> - ${t.dt_inicio}</span>
                        <span>${t.acertos} de ${t.total_questoes} acertos (${t.erros} erros)</span>
                        <span><strong>${t.percentual}%</strong> - ${t.classificacao}</span>
                    </div>
                `;
            }

            lista.innerHTML = html;
        }

        // Monta o gráfico de barras com o resultado da enquete "Já jogou basquete?"
        function exibirGraficoEnquete() {
            fetch("/enquetes/listar", { cache: 'no-store' })
                .then(function (response) {
                    if (response.ok) {
                        return response.json();
                    }
                    throw "Não foi possível carregar o resultado da enquete!";
                })
                .then(function (enquetes) {
                    renderizarGraficoBarras(enquetes);
                })
                .catch(function (error) {
                    console.error(`Erro na obtenção do resultado da enquete: ${error}`);
                });
        }

        function renderizarGraficoBarras(enquetes) {
            if (graficoBarras) {
                graficoBarras.destroy();
                graficoBarras = null;
            }

            var dados = { SIM: 0, NAO: 0 };
            for (var i = 0; i < enquetes.length; i++) {
                if (enquetes[i].resposta) {
                    dados[enquetes[i].resposta] = enquetes[i].total || 0;
                }
            }

            graficoBarras = new Chart(document.getElementById("graficoBarrasEnquete"), {
                type: 'bar',
                data: {
                    labels: ["Sim", "Não"],
                    datasets: [
                        {
                            label: "Votos",
                            data: [
                                dados.SIM,
                                dados.NAO
                            ],
                            backgroundColor: [
                                "rgb(46, 125, 50)",
                                "rgb(255, 107, 53)"
                            ],
                            borderColor: "#161618",
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: "#FFFEe0" }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: "#d8d8d8" }
                        },
                        x: {
                            ticks: { color: "#d8d8d8" }
                        }
                    }
                }
            });
        }
    </script>

</body>

</html>
